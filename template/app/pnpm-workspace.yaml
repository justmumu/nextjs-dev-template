# The application owns its dependency graph: this file makes it a standalone
# workspace root, so nothing is resolved from a parent directory.
# Dependency policy (KTD7, KTD11): protected, reviewed separately from dependency changes.
strictDepBuilds: true
verifyDepsBeforeRun: error
enablePrePostScripts: false
skills:
  dirs: []
allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false
# Reviewed graph rewrite: VitePress 1.6.4 pins DocSearch 3.8.2 (React <=18 peers); 3.9.0 adds React 19 support.
overrides:
  "vitepress@1.6.4>@docsearch/js": 3.9.0
  "vitepress@1.6.4>@docsearch/css": 3.9.0
  "form-data@<2.5.0": 2.5.6
  "qs@<6.6.0": 6.16.1
