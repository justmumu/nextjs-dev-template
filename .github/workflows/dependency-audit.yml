# Scheduled report of the known advisories of the runtime, development and tool graphs. It reads and
# reports; it never fixes, overrides, opens a pull request or merges.
name: Dependency audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js and the pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            template/app/pnpm-lock.yaml
      - name: Record the toolchain of this job
        run: node scripts/ci/context.cjs toolchain --lane=24
      - name: Install dependencies from the frozen lock
        run: pnpm install --frozen-lockfile
      - name: Report advisories against the reviewed decisions
        run: pnpm run audit:dependencies
