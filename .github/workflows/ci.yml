# Common CI: the same file in the generator and in every application. The plan job reads the role of the
# repository; the jobs below run the commands of that role. Fork pull requests run with the read-only
# pull_request token and no secrets; no job here runs fork code with a privileged token.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      role: ${{ steps.plan.outputs.role }}
      initialize: ${{ steps.plan.outputs.initialize }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Read the role of this repository
        id: plan
        run: node scripts/ci/context.cjs plan

  static:
    name: Static and unit
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js and the pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            template/app/pnpm-lock.yaml
      - name: Record the toolchain of this job
        run: node scripts/ci/context.cjs toolchain --lane=24
      - name: Install dependencies from the frozen lock
        run: pnpm install --frozen-lockfile
      - name: Lock, format, lint, types, unit tests and coverage
        run: pnpm run check
      - name: Documentation build and link check
        run: pnpm run docs:build

  production:
    name: Production build and browsers
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js and the pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            template/app/pnpm-lock.yaml
      - name: Record the toolchain of this job
        run: node scripts/ci/context.cjs toolchain --lane=24
      - name: Install dependencies from the frozen lock
        run: pnpm install --frozen-lockfile
      - name: Install the dependencies of the application seed
        if: needs.plan.outputs.role == 'generator'
        working-directory: template/app
        run: pnpm install --frozen-lockfile
      - name: Install the pinned browsers
        working-directory: ${{ needs.plan.outputs.role == 'generator' && 'template/app' || '.' }}
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium webkit
      - name: Allow the unprivileged namespaces of the offline build proof
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Production build and the Chromium and WebKit lanes
        run: pnpm run test:e2e
      - name: Standalone portability
        run: pnpm run test:artifact
      - name: Browser harness integration and negative controls
        if: needs.plan.outputs.role == 'generator'
        run: pnpm run test:integration --suite=browser-integration
      - name: Keep the failure reports of the browser lanes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-failure-reports
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  application-integration:
    name: Application integration
    needs: plan
    if: needs.plan.outputs.role == 'application'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js and the pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            template/app/pnpm-lock.yaml
      - name: Record the toolchain of this job
        run: node scripts/ci/context.cjs toolchain --lane=24
      - name: Install dependencies from the frozen lock
        run: pnpm install --frozen-lockfile
      - name: Dependencies, hooks and release scenarios
        run: pnpm run test:integration

  ci-result:
    name: CI result
    if: always()
    needs: [plan, static, production, application-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Every job that ran passed
        run: echo "all jobs passed or were skipped by role"
